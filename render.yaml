# Render Blueprint — ExamBeautify
# This file tells Render how to build and run your app

services:
  - type: web
    name: exam-beautify
    runtime: node
    plan: free
    buildCommand: |
      npm install &&
      npx puppeteer browsers install chrome &&
      npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer
      - key: GEMINI_API_KEY
        sync: false
